openapi: 3.0.0
info:
  title: API de Airsoft
  description: API para gestionar usuarios, reservas, mapas, modos de juego, equipamiento, eventos competitivos, mensajes de contacto y más.
  version: 1.0.0
paths:

  /account:
    get:
      summary: "Listar usuarios (paginación)"
      tags:
        - Account
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/GetAccountList200'
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /account/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      summary: "Obtener cuenta de un usuario por ID"
      tags:
        - Account
      responses:
        '200':
          description: Detalle de la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: "Actualizar parcialmente la cuenta del usuario"
      tags:
        - Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccount'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /account/{id}/reservations:
    get:
      summary: "Listar reservaciones por ID del usuario (paginación)"
      tags:
        - Account
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/GetReservationsList200'
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /account/{id}/toggle_status:
    patch:
      summary: "Actualizar el estado de un usuario"
      tags:
        - Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                is_active:
                  type: "boolean"
                  description: "Estado del usuario"
                  example: false
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /account/{id}/gender:
    patch:
      summary: "Actualizar el genero de un usuario"
      tags:
        - Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                gender:
                  type: "string"
                  description: "Genero con el que se identifica el usuario"
                  example: "Masculino"
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /account/{id}/password:
    patch:
      summary: "Actualizar la contraseña de la cuenta del usuario"
      tags:
        - Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                password:
                  type: "string"
                  description: "Contraseña del usuario"
                  example: "Nueva contraseña"
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /authentication/login:
    post:
      summary: "Autentica a un usuario"
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                email:
                  type: "string"
                  description: "Correo electrónico del usuario"
                  example: "user@example.com"
                password:
                  type: "string"
                  description: "Contraseña del usuario"
                  example: "password123"
      responses:
        '200':
          description: "Acceso válido. Retorna token JWT y user_id"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  token:
                    type: "string"
                    example: "eyJhbGci..."
                  user_id:
                    type: "integer"
                    example: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errores'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /authentication/register:
    post:
      summary: "Registrar nuevo usuario"
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                  description: "Nombre del usuario"
                  example: "PEPITO"
                username:
                  type: "string"
                  description: "Nombre personalizado del usuario"
                  example: "PEPITO HACK"
                email:
                  type: "string"
                  description: "Email del usuario"
                  example: "example@gmail.com"
                password:
                  type: "string"
                  description: "Contraseña del usuario"
                  example: "NSAxased123"
                dni:
                  type: "string"
                  description: "Número de documento del usuario"
                  example: "11457812"
                phone:
                  type: "string"
                  description: "Número de celular del usuario"
                  example: "11784623"
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /gamemodes:
    get:
      summary: "Listar modos de juego"
      tags:
        - Gamemodes
      responses:
        '200':
          description: "Lista de modos de juego"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  gamemodes:
                    type: "array"
                    items:
                      $ref: '#/components/schemas/GameMode'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: "Crear un modo de juego"
      tags:
        - Gamemodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                  description: "Nombre del modo"
                  example: "todos vs todos"
                duration:
                  type: "string"
                  description: "Duracion del modo (30, 60, 90, 120)"
                  example: "60"
                players:
                  type: "integer"
                  description: "Cantidad de jugadores en el modo"
                  example: 16
                description:
                  type: "string"
                  description: "Descripcion breve del modo de juego"
                  example: "Supervivencia"
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /gamemodes/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      summary: "Reemplazar un modo de juego"
      tags:
        - Gamemodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                  description: "Nombre del modo"
                  example: "todos vs todos"
                duration:
                  type: "string"
                  description: "Duracion del modo (30, 60, 90, 120)"
                  example: "60"
                players:
                  type: "integer"
                  description: "Cantidad de jugadores en el modo"
                  example: 16
                description:
                  type: "string"
                  description: "Descripcion breve del modo de juego"
                  example: "Supervivencia"
      responses:
        '200':
          $ref: '#/components/responses/Updated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: "Elimina un modo de juego"
      tags:
        - Gamemodes
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /gamemodes/{id}/maps:
    put:
      summary: "Reemplazar los mapas asociados a un modo de juego"
      tags:
        - Gamemodes
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                map_ids:
                  type: "array"
                  description: "Lista de IDs de mapas"
                  items:
                    type: "integer"
                  example: [1, 2, 3]
      responses:
        '200':
          $ref: '#/components/responses/Updated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /reviews:
    get:
      summary: "Listar reseñas (paginación)"
      tags:
        - Reviews
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: approved
          in: query
          schema:
            type: "boolean"
          description: "Filtrar por estado de aprobación"
          required: false
          example: true
      responses:
        '200':
          $ref: '#/components/responses/GetReviewsList200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: "Crear una reseña de mapa"
      tags:
        - Reviews
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReview'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /reviews/auth/{id}:
    patch:
      summary: "Actualizar estado de reseña"
      tags:
        - Reviews
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                approved:
                  type: "boolean"
                  description: "Cambia si la reseña esta aprobada o no"
                  example: true
                admin_response:
                  type: "string"
                  description: "Respuesta del administrador"
                  example: "Gracias por tu reseña"
      responses:
        '200':
          $ref: '#/components/responses/Updated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /reservations:
    get:
      summary: "Listar reservaciones con filtros"
      tags:
        - Reservations
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: sala_id
          in: query
          schema:
            type: "integer"
          description: "Filtrar por ID de sala"
          required: false
          example: 1
      responses:
        '200':
          $ref: '#/components/responses/GetReservationsList200'
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /reservations/{id}:
    patch:
      summary: "Actualizar parcialmente la reserva"
      tags:
        - Reservations
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReservation'
      responses:
        '200':
          $ref: '#/components/responses/Updated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /reservations/register/{sala_id}:
    post:
      summary: "Unirse a una sala pública"
      tags:
        - Reservations
      parameters:
        - name: sala_id
          in: path
          required: true
          schema:
            type: "integer"
          description: "ID de la sala"
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                account_id:
                  type: "integer"
                  description: "ID de la cuenta del usuario"
                  example: 1
                equipment_kit_id:
                  type: "integer"
                  description: "ID del kit de equipamiento"
                  example: 1
      responses:
        '200':
          description: "Unido a la sala exitosamente"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                    example: "Te uniste a la sala exitosamente"
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /dashboard/disponibility:
    get:
      summary: "Listar las reservas en un periodo de tiempo"
      tags:
        - Dashboard
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: date
          in: query
          schema:
            type: "string"
            format: date
          description: "Fecha para filtrar (YYYY-MM-DD)"
          required: false
          example: "2025-05-12"
      responses:
        '200':
          $ref: '#/components/responses/GetDashboardList200'
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /dashboard/data:
    get:
      summary: "Obtener datos del dashboard (reservas, frecuencia, ingresos)"
      tags:
        - Dashboard
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: date
          in: query
          schema:
            type: "string"
            format: date
          description: "Fecha para filtrar (YYYY-MM-DD)"
          required: false
          example: "2025-05-12"
      responses:
        '200':
          description: "Datos del dashboard"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  reservas:
                    type: "array"
                    items:
                      $ref: '#/components/schemas/DashboardReserva'
                  frecuencia:
                    type: "object"
                    additionalProperties:
                      type: "integer"
                    example: {"10:00": 3, "12:00": 5}
                  ingresos:
                    type: "number"
                    example: 150000.50
                  total:
                    type: "integer"
                    example: 25
                  total_capacidad:
                    type: "integer"
                    example: 50
        '500':
          $ref: '#/components/responses/InternalServerError'

  /maps/disponibility:
    get:
      summary: "Listar Mapas"
      tags:
        - Mapas
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/GetMapsList200'
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /equipmentkit:
    get:
      summary: "Listar kit de equipamientos"
      tags:
        - EquipmentKit
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: category
          in: query
          schema:
            type: "string"
          description: "Filtrar por categoría"
          required: false
          example: "armas"
      responses:
        '200':
          $ref: '#/components/responses/GetEquipmentkitList200'
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: "Crear un kit de equipamiento"
      tags:
        - EquipmentKit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEquipmentKit'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /equipmentkit/categories:
    get:
      summary: "Listar categorías de equipamiento"
      tags:
        - EquipmentKit
      responses:
        '200':
          description: "Lista de categorías"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  categories:
                    type: "array"
                    items:
                      type: "string"
                    example: ["armas", "proteccion", "accesorios"]
  /equipmentkit/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      summary: "Obtener un kit de equipamiento por ID"
      tags:
        - EquipmentKit
      responses:
        '200':
          description: "Detalle del kit de equipamiento"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  equipmentkit:
                    $ref: '#/components/schemas/EquipmentKit'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: "Eliminar un kit de equipamiento"
      tags:
        - EquipmentKit
      responses:
        '200':
          description: "Kit de equipamiento eliminado"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                    example: "Kit de equipamiento eliminado exitosamente"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /competitivo:
    get:
      summary: "Listar eventos competitivos"
      tags:
        - Competitivo
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: "Lista de eventos competitivos"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  events:
                    type: "array"
                    items:
                      $ref: '#/components/schemas/CompetitivoEvent'
                  total:
                    type: "integer"
                    example: 10
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: "Crear un evento competitivo"
      tags:
        - Competitivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompetitivoEvent'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /competitivo/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      summary: "Obtener un evento competitivo por ID"
      tags:
        - Competitivo
      responses:
        '200':
          description: "Detalle del evento"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  event:
                    $ref: '#/components/schemas/CompetitivoEvent'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: "Reemplazar un evento competitivo"
      tags:
        - Competitivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompetitivoEvent'
      responses:
        '200':
          $ref: '#/components/responses/Updated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: "Eliminar un evento competitivo"
      tags:
        - Competitivo
      responses:
        '200':
          description: "Evento eliminado"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                    example: "Evento eliminado exitosamente"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /nosotros:
    get:
      summary: "Obtener información de la empresa"
      tags:
        - Nosotros
      responses:
        '200':
          description: "Información de la empresa y tarjetas"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  info:
                    type: "object"
                    description: "Información de la empresa"
                    properties:
                      title:
                        type: "string"
                        example: "Sobre Nosotros"
                      paragraphs:
                        type: "array"
                        items:
                          type: "string"
                        example: ["Somos una empresa..."]
                      image_url:
                        type: "string"
                        example: "/img/about.jpg"
                  cards:
                    type: "array"
                    items:
                      $ref: '#/components/schemas/NosotrosCard'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /contacto:
    post:
      summary: "Enviar un mensaje de contacto"
      tags:
        - Contacto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                user_name:
                  type: "string"
                  description: "Nombre del remitente"
                  example: "Juan Perez"
                email:
                  type: "string"
                  description: "Email del remitente"
                  example: "juan@example.com"
                message:
                  type: "string"
                  description: "Mensaje"
                  example: "Quiero mas informacion"
      responses:
        '201':
          description: "Mensaje enviado"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                    example: "Mensaje enviado"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: "Ver todos los mensajes de contacto"
      tags:
        - Contacto
      responses:
        '200':
          description: "Lista de mensajes"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: '#/components/schemas/ContactoMensaje'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /contacto/{msg_id}/leer:
    post:
      summary: "Marcar un mensaje como leído"
      tags:
        - Contacto
      parameters:
        - name: msg_id
          in: path
          required: true
          schema:
            type: "integer"
          description: "ID del mensaje"
          example: 1
      responses:
        '200':
          description: "Mensaje marcado como leído"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                    example: "ok"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /services:
    get:
      summary: "Listar servicios"
      tags:
        - Services
      responses:
        '200':
          description: "Lista de servicios"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  services:
                    type: "array"
                    items:
                      $ref: '#/components/schemas/Service'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: "Crear un servicio"
      tags:
        - Services
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                  example: "Alquiler de marcadoras"
                description:
                  type: "string"
                  example: "Alquiler de equipamiento basico"
                price:
                  type: "number"
                  example: 5000.00
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /services/{service_id}:
    parameters:
      - name: service_id
        in: path
        required: true
        schema:
          type: "integer"
        description: "ID del servicio"
        example: 1
    get:
      summary: "Obtener un servicio por ID"
      tags:
        - Services
      responses:
        '200':
          description: "Detalle del servicio"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  service:
                    $ref: '#/components/schemas/Service'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: "Actualizar un servicio"
      tags:
        - Services
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                  example: "Alquiler de marcadoras"
                description:
                  type: "string"
                  example: "Alquiler de equipamiento basico"
                price:
                  type: "number"
                  example: 5000.00
      responses:
        '200':
          description: "Servicio actualizado"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                    example: "Servicio actualizado"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: "Eliminar un servicio"
      tags:
        - Services
      responses:
        '200':
          description: "Servicio eliminado"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                    example: "Servicio eliminado"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /salas:
    get:
      summary: "Listar salas"
      tags:
        - Salas
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: "Lista de salas"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  salas:
                    type: "array"
                    items:
                      $ref: '#/components/schemas/Sala'
                  total:
                    type: "integer"
                    example: 5
                  _links:
                    $ref: '#/components/schemas/Links'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: "Crear una sala"
      tags:
        - Salas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSala'
      responses:
        '201':
          description: "Sala creada"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                    example: "Sala creada exitosamente"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /salas/{id}:
    patch:
      summary: "Actualizar una sala"
      tags:
        - Salas
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSala'
      responses:
        '200':
          description: "Sala actualizada"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                    example: "Sala 1 actualizada correctamente"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:

    ReservaResumen:
      type: "object"
      description: "Información esencial de una reserva"
      properties:
        id:
          type: "integer"
          description: "ID de reserva único"
          example: 1
        sala_id:
          type: "integer"
          description: "ID de la sala"
          example: 1
        account_id:
          type: "integer"
          description: "ID de cuenta del usuario"
          example: 1
        equipment_kit_id:
          type: "integer"
          description: "ID del kit de equipamiento"
          example: 1
        price:
          type: "number"
          description: "Precio de la reserva"
          example: 30000
        created_at:
          type: "string"
          description: "Fecha de creacion de la reserva"
          example: "2025-05-12 16:30:00"
        canceled:
          type: "boolean"
          description: "Estado de cancelación de la reserva"
          example: false
        cancelation_reason:
          type: "string"
          description: "Motivo de cancelación"
          example: ""

    AccountUser:
      type: "object"
      description: "Información de un usuario"
      properties:
        id:
          type: "integer"
          example: 1
        name:
          type: "string"
          description: "Nombre completo del usuario"
          example: "Pepe Ramirez"
        username:
          type: "string"
          description: "Nombre del usuario personalizado"
          example: "PEPITO123"
        email:
          type: "string"
          description: "Email del usuario"
          example: "example@gmail.com"
        dni:
          type: "string"
          description: "DNI del usuario"
          example: "11457812"
        phone:
          type: "string"
          description: "Número de celular del usuario"
          example: "11784623"
        gender:
          type: "string"
          description: "Genero del usuario"
          example: "Masculino"
        about_me:
          type: "string"
          description: "Descripción del usuario"
          example: "soy veterano, busco amig@s"
        is_active:
          type: "boolean"
          description: "Estado actual del usuario"
          example: true
        is_admin:
          type: "boolean"
          description: "Si es administrador"
          example: false
        elo:
          type: "integer"
          description: "Nivel estimado del jugador"
          example: 2500
        played_games:
          type: "integer"
          description: "Partidas jugadas"
          example: 42
        hours_played:
          type: "integer"
          description: "Horas jugadas"
          example: 168
        created_at:
          type: "string"
          example: "2025-01-15 10:00:00"
        updated_at:
          type: "string"
          example: "2025-05-12 16:30:00"

    UpdateAccount:
      type: "object"
      description: "Campos para actualizar una cuenta"
