        username:
          type: "string"
          description: "Nombre personalizado"
          example: "NuevoNombre"
        email:
          type: "string"
          description: "Email"
          example: "nuevo@example.com"
        password:
          type: "string"
          description: "Contraseña"
          example: "nuevapass123"
        phone:
