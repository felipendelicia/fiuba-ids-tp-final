{% extends 'base.html' %}
{% block title %}Kinetix - Editar Evento{% endblock %}
{% block content %}
<section class="section-tactical" style="min-height: calc(100vh - 56px); padding: 80px 0;">
    <div class="container">
        <a href="{{ url_for('modalidades') }}" class="btn btn-outline-info mb-4">&laquo; Volver</a>
        <div class="p-4 rounded-3 shadow-lg card-dark" style="max-width:600px;margin:0 auto;">
            <h2 class="admin-table-header" style="letter-spacing:1px;margin-bottom:1.5rem;">Editar Evento</h2>
            <form method="POST" class="d-flex flex-column gap-3">
                <input type="text" name="title" class="form-control bg-dark text-white border-secondary" value="{{ event.title }}" required>
                <input type="text" name="badge" class="form-control bg-dark text-white border-secondary" value="{{ event.badge or '' }}" placeholder="Badge">
                <input type="text" name="image_url" class="form-control bg-dark text-white border-secondary" value="{{ event.image_url or '' }}" placeholder="Imagen">
                <input type="text" name="event_date" class="form-control bg-dark text-white border-secondary" value="{{ event.event_date or '' }}" placeholder="Fecha">
                <input type="text" name="event_time" class="form-control bg-dark text-white border-secondary" value="{{ event.event_time or '' }}" placeholder="Hora">
                <textarea name="description" class="form-control bg-dark text-white border-secondary" placeholder="Descripcion" rows="4">{{ event.description or '' }}</textarea>
                <div class="d-flex gap-2 justify-content-end">
                    <a href="{{ url_for('modalidades') }}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn fw-bold btn-gradient-cyan">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
