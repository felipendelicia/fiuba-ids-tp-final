{% extends 'base.html' %}
{% block title %}Kinetix - Editar Evento{% endblock %}
{% block content %}
<section style="background-color: #0b0d0f; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 20px 20px; min-height: calc(100vh - 56px); padding: 80px 0;">
    <div class="container">
        <a href="{{ url_for('modalidades') }}" class="btn btn-outline-info mb-4">&laquo; Volver</a>
        <div class="p-4 rounded-3 shadow-lg" style="background-color: rgba(18, 22, 26, 0.8); border: 1px solid rgba(79, 172, 254, 0.25); max-width:600px;margin:0 auto;">
            <h2 style="font-family:'Orbitron',sans-serif;color:#00f2fe;letter-spacing:1px;margin-bottom:1.5rem;">Editar Evento</h2>
            <form method="POST" class="d-flex flex-column gap-3">
                <input type="text" name="title" class="form-control bg-dark text-white border-secondary" value="{{ event.title }}" required>
                <input type="text" name="badge" class="form-control bg-dark text-white border-secondary" value="{{ event.badge or '' }}" placeholder="Badge">
                <input type="text" name="image_url" class="form-control bg-dark text-white border-secondary" value="{{ event.image_url or '' }}" placeholder="Imagen">
                <input type="text" name="event_date" class="form-control bg-dark text-white border-secondary" value="{{ event.event_date or '' }}" placeholder="Fecha">
                <input type="text" name="event_time" class="form-control bg-dark text-white border-secondary" value="{{ event.event_time or '' }}" placeholder="Hora">
                <textarea name="description" class="form-control bg-dark text-white border-secondary" placeholder="Descripción" rows="4">{{ event.description or '' }}</textarea>
                <div class="d-flex gap-2 justify-content-end">
                    <a href="{{ url_for('modalidades') }}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn fw-bold" style="background:linear-gradient(135deg,#00f2fe 0%,#4facfe 100%);border:none;color:#000;">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
