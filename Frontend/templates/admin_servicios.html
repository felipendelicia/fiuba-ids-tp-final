{% extends 'base.html' %}

{% block content %}
<section id="sectionServiciosAdmin">
    <div id="titleContent">
        <h1>PANEL ADMINISTRADOR DE SERVICIOS</h1>
    </div>
    <div class="box-panel">
        <div class="box-agregarservicio">
            <h5>Agregar Nuevo Servicio</h5>
            <form action="{{ url_for('admin_servicios_crear') }}" method="POST" class="row g-3">
                <div class="col-md-4">
                    <input type="text" class="form-control" name="name" placeholder="Nombre del servicio" required>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control" name="summary_title" placeholder="Título resumen">
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control" name="summary_text" placeholder="Texto resumen">
                </div>
                <div class="col-md-3">
                    <input type="text" class="form-control" name="tab_icon" placeholder="Ícono (ej: bi bi-cup-hot)">
                </div>
                <div class="col-md-3">
                    <input type="text" class="form-control" name="tab_image" placeholder="Imagen tab (ej: img/bufet.png)">
                </div>
                <div class="col-md-3">
                    <input type="text" class="form-control" name="bullet_1" placeholder="Bullet 1">
                </div>
                <div class="col-md-3">
                    <input type="text" class="form-control" name="bullet_2" placeholder="Bullet 2">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-success w-100">Agregar</button>
                </div>
            </form>
        </div>

        <table class="tabla-adminServicios">
            <thead class="titulo-tablaAdminServicio">
                <tr>
                    <th>ID</th>
                    <th>Servicio</th>
                    <th>Descripción</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for s in servicios %}
                <tr>
                    <td>{{ s.id }}</td>
                    <td><strong>{{ s.name }}</strong></td>
                    <td>{{ s.summary_text or '' }}</td>
                    <td>
                        <a href="{{ url_for('admin_servicios_editar', service_id=s.id) }}" class="btn btn-sm btn-warning">Editar</a>
                        <form method="POST" action="{{ url_for('admin_servicios_eliminar', service_id=s.id) }}" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</section>
{% endblock %}
