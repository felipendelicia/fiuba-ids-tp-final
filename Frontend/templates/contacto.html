{% extends 'base.html' %}

{% block title %}Airsoft - Contacto Operativo{% endblock %}

{% block style_extra %}
<link rel="stylesheet" href="{{ url_for('static', filename='styles/contacto.css') }}">
{% endblock %}

{% block content %}
<section class="contacto-section">
    <h1 class="contacto-title">Centro de Comunicaciones</h1>
    <p class="contacto-subtitle">¿Dudas sobre reservas o torneos? Envíanos un reporte.</p>

    <div class="contacto-card">
        <form action="{{ url_for('contacto') }}" method="POST">

            <div class="form-group">
                <label for="nombre">Nombre / Callsign</label>
                <input type="text" id="nombre" name="nombre" class="form-control-custom" value="{{ usuario.user_name }}" placeholder="Ej: Dante 'Ghostface' Ghisi" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" class="form-control-custom" value="{{ usuario.email }}" placeholder="example@ejemplo.com" required>
            </div>

            <div class="form-group">
                <label for="mensaje">Transmisión (Mensaje)</label>
                <textarea id="mensaje" name="mensaje" class="form-control-custom" placeholder="Escribe los detalles de tu consulta aquí..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">Enviar Reporte</button>

        </form>
    </div>
</section>
{% endblock %}
