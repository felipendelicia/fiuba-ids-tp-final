{% extends 'base.html' %}
{% block title %}Kinetix - Dejanos tu reseña{% endblock %}
{% block style_extra %}
<link rel="stylesheet" href="{{ url_for('static', filename='styles/resenias.css') }}">
{% endblock %}
{% block content %}
<section class="review-section">
    <div class="review-header">
        <h1 class="review-title">¡Dejanos tu reseña!</h1>
        <p class="review-subtitle">Tu opinión nos ayuda a mejorar la experiencia de todos los jugadores</p>
    </div>

    <div class="review-form-container">
        <form action="{{ url_for('guardar_resenia') }}" method="POST" class="review-grid">

            <div class="form-group">
                <label class="form-label">Nombre de usuario</label>
                <input type="text" class="form-input" value="{{ nombre_usuario }}" readonly>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Mapa <span class="required">*</span></label>
                    <select name="mapa" class="form-input" required>
                        <option value="" disabled selected hidden>Seleccionar...</option>
                        <option value="nuketown">Nuketown</option>
                        <option value="mirage">Mirage</option>
                        <option value="hijacked">Hijacked</option>
                        <option value="terminal">Terminal</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Puntuación <span class="required">*</span></label>
                    <select name="puntuacion" class="form-input" required>
                        <option value="" disabled selected hidden>Seleccionar...</option>
                        <option value="5">5 - Excelente</option>
                        <option value="4">4 - Muy Bueno</option>
                        <option value="3">3 - Bueno</option>
                        <option value="2">2 - Regular</option>
                        <option value="1">1 - Mala</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Título de la reseña</label>
                <input type="text" name="titulo" class="form-input" placeholder="Ej: ¡Excelente mapa! / Hubo un problema...">
            </div>

            <div class="form-group">
                <label class="form-label">Comentarios <span class="required">*</span></label>
                <textarea name="comentario" class="form-input" rows="5" required placeholder="Contanos sobre tu experiencia en el campo..."></textarea>
            </div>

            <div class="form-group">
                <button type="submit" class="btn-enviar-resena">Publicar reseña</button>
            </div>

        </form>
    </div>
</section>
{% endblock %}
