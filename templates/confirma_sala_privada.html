{% extends 'base.html' %}

{% block title %}Kinetix - Sala Creada{% endblock %}

{% block content %}
<div class="container d-flex flex-column align-items-center justify-content-center sala-exito" style="margin-top: 20rem; user-select: none;">

  <!-- Animación de sobre/correo -->
  <div class="animation-wrapper mb-4">
    <div class="envelope">
      <div class="top-flap"></div>
      <div class="letter">
        <div class="letter-text">✔</div>
      </div>
      <div class="envelope-body"></div>
    </div>
    <div class="mailbox">
      <div class="mailbox-slot"></div>
    </div>
  </div>

  <!-- Mensaje principal -->
  <h2 class="fw-bold text-center mb-2 sala-title">
    ¡SALA CREADA EXITOSAMENTE!
  </h2>
  <p class="sala-text text-center mb-4">
    Recibirás un mensaje de confirmación por correo electrónico.
  </p>

  <!-- Loader circular -->
  <div class="loader"></div>
</div>

<style>
.animation-wrapper {
  position: relative;
  width: 150px;
  height: 150px;
}

/* Sobre */
.envelope {
  position: absolute;
  left: 45px;
  top: 10px;
  width: 60px;
  height: 40px;
  background-color: #ffffff;
  border-radius: 2px;
  animation: dropLetter 2.5s cubic-bezier(0.6, -0.28, 0.735, 0.045) infinite;
  z-index: 2;
}
.top-flap {
  position: absolute;
  top: 0;
  width: 0;
  height: 0;
  border-left: 30px solid transparent;
  border-right: 30px solid transparent;
  border-top: 20px solid #e0e0e0;
}
.envelope-body {
  position: absolute;
  bottom: 0;
  width: 0;
  height: 0;
  border-left: 30px solid #f5f5f5;
  border-right: 30px solid #f5f5f5;
  border-bottom: 25px solid #eaeaea;
}
.letter {
  position: absolute;
  top: 5px;
  left: 5px;
  width: 50px;
  height: 30px;
  background: #fff;
  border: 1px solid #ddd;
  animation: pullOut 2.5s ease-in-out infinite;
}
.letter-text {
  font-size: 14px;
  text-align: center;
  line-height: 30px;
  background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Buzón */
.mailbox {
  position: absolute;
  bottom: 10px;
  left: 25px;
  width: 100px;
  height: 70px;
  background: linear-gradient(135deg, #1e222b 0%, #141619 100%);
  border: 2px solid #4facfe;
  border-radius: 8px 8px 0 0;
  box-shadow: 0 0 15px rgba(79, 172, 254, 0.3);
}
.mailbox-slot {
  position: absolute;
  top: 15px;
  left: 10px;
  width: 80px;
  height: 8px;
  background-color: #05070a;
  border-radius: 4px;
  border: 1px solid rgba(79, 172, 254, 0.4);
}

/* Texto con gradiente celeste */
.sala-title {
  font-family: 'Orbitron', sans-serif;
  background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 1px;
  font-weight: 700;
}
.sala-text {
  max-width: 400px;
  font-size: 1rem;
  font-family: 'Orbitron', sans-serif;
  background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-align: center;
  font-weight: 500;
}

/* Loader circular */
.loader {
  border: 6px solid rgba(255,255,255,0.1);
  border-top: 6px solid #00f2fe;
  border-right: 6px solid #4facfe;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  animation: spin 1s linear infinite;
}

/* Animaciones */
@keyframes dropLetter {
  0% { transform: translateY(-50px) scale(0); opacity: 0; }
  20% { transform: translateY(0) scale(1); opacity: 1; }
  50% { transform: translateY(0) scale(1); opacity: 1; }
  75% { transform: translateY(35px) scale(0.6); opacity: 0.8; }
  85%, 100% { transform: translateY(50px) scale(0); opacity: 0; }
}
@keyframes pullOut {
  0%, 20% { transform: translateY(0); }
  35%, 50% { transform: translateY(-15px); }
  70%, 100% { transform: translateY(0); }
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>

<script>
  // Redirige al index después de 4 segundos
  setTimeout(function() {
    window.location.href = "{{ url_for('index') }}";
  }, 4000);
</script>
{% endblock %}
