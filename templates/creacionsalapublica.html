{% extends 'defaultadmin.html' %}

{% block title %}Kinetix - Panel de Administración de Salas{% endblock %}

{% block content %}
<div class="container text-center my-5">
    <h1 class="display-4 fw-bold mb-5" style="font-family: 'Orbitron', 'Arial Black', sans-serif; background: linear-gradient(135deg, #ffe082 0%, #ffb300 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px;">
        CREAR PARTIDA PÚBLICA (ADMIN)
    </h1>

    <div class="row justify-content-center">
        <div class="col-md-6 text-start p-4 rounded-3" style="background-color: rgba(20, 22, 25, 0.95); border: 2px solid #ffb300; box-shadow: 0 0 30px rgba(255, 179, 0, 0.15);">
            
            <form action="{{ url_for('crearsala') }}" method="POST">
                
                <div class="mb-4">
                    <label class="form-label fw-bold small" style="color: #ffe082; letter-spacing: 1px;">ID DE RESERVA</label>
                    <input type="text" name="id_reserva" class="form-control bg-dark text-white border-secondary py-2" placeholder="Ej: RES-9942" style="border-radius: 6px;" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold small" style="color: #ffe082; letter-spacing: 1px;">MODALIDAD OFICIAL</label>
                    <select name="modalidad" class="form-select bg-dark text-white border-secondary py-2" style="border-radius: 6px;" required>
                        <option selected disabled value="">Selecciona una modalidad global</option>
                        <option value="Todos contra Todos (Deathmatch)">Todos contra Todos (Deathmatch)</option>
                        <option value="Captura la Bandera (CTF)">Captura la Bandera (CTF)</option>
                        <option value="Operación Táctica (Por Equipos)">Operación Táctica (Por Equipos)</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold small" style="color: #ffe082; letter-spacing: 1px;">ZONA / ESCENARIO</label>
                    <select name="escenario" class="form-select bg-dark text-white border-secondary py-2" style="border-radius: 6px;" required>
                        <option selected disabled value="">Selecciona un escenario oficial</option>
                        <option value="Búnker Subterráneo Alpha">Búnker Subterráneo Alpha</option>
                        <option value="Hangar de Carga Abandonado">Hangar de Carga Abandonado</option>
                        <option value="Bosque de Operaciones Tácticas">Bosque de Operaciones Tácticas</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold small" style="color: #ffe082; letter-spacing: 1px;">FECHA DE APERTURA</label>
                    <input type="date" name="fecha" class="form-control bg-dark text-white border-secondary py-2" style="border-radius: 6px;" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold small" style="color: #ffe082; letter-spacing: 1px;">HORA DE ENTRADA</label>
                    <input type="time" name="hora" class="form-control bg-dark text-white border-secondary py-2" style="border-radius: 6px;" required>
                </div>

                <hr style="border-color: rgba(255, 224, 130, 0.2); margin: 25px 0;">

                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="text-white-50 small" style="letter-spacing: 0.5px;">LÍMITE DE JUGADORES:</span>
                    <span class="text-white fw-bold" style="font-family: 'Orbitron', sans-serif;">10 JUGADORES</span>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <span class="text-white-50 small" style="letter-spacing: 0.5px;">ESTADO DEL CANAL:</span>
                    <span class="fw-bold" style="color: #ffb300; font-family: 'Orbitron', sans-serif;">[ RESERVA DE ADMIN ]</span>
                </div>

                <button type="submit" class="btn btn-lg w-100 fw-bold text-dark py-2 shadow-lg" style="background: linear-gradient(135deg, #ffe082 0%, #ffb300 100%); border: none; border-radius: 6px; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(255, 179, 0, 0.3) !important;">
                    LANZAR SALA AL PÚBLICO
                </button>

            </form>

        </div>
    </div>
</div>
{% endblock %}
