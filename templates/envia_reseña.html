{% extends 'default.html' %}

{% block title %}Kinetix - Reseña Enviada{% endblock %}

{% block content %}
<div class="container d-flex flex-column align-items-center justify-content-center" style="min-height: 70vh; user-select: none; cursor: default;">
    
    <div class="animation-wrapper mb-4">
        <div class="envelope">
            <div class="top-flap"></div>
            <div class="letter">
                <div class="letter-text">⭐⭐⭐⭐⭐</div>
            </div>
            <div class="envelope-body"></div>
        </div>
        <div class="mailbox">
            <div class="mailbox-slot"></div>
        </div>
    </div>

    <h2 class="fw-bold text-center mb-2" style="font-family: 'Orbitron', sans-serif; color: #00d2ff; letter-spacing: 1px;">
        ¡RESEÑA ENVIADA CON ÉXITO!
    </h2>
    <p class="text-white-50 text-center mb-4" style="max-width: 400px; font-size: 0.95rem;">
        Tu opinión fue registrada en el sistema. Redirigiéndote al panel principal...
    </p>

    <div class="progress bg-dark border border-secondary border-opacity-25" style="width: 200px; height: 4px; border-radius: 2px;">
        <div class="progress-bar" style="background: #00d2ff; width: 0%; animation: loadBar 3.5s linear forwards;"></div>
    </div>
</div>

<style>
.animation-wrapper {
    position: relative;
    width: 150px;
    height: 150px;
}

/* Estilos de la carta/sobre */
.envelope {
    position: absolute;
    left: 45px;
    top: 10px;
    width: 60px;
    height: 40px;
    background-color: #ffffff;
    border-radius: 2px;
    animation: dropLetter 2.5s cubic-bezier(0.6, -0.28, 0.735, 0.045) infinite;
    z-index: 2;
}
.top-flap {
    position: absolute;
    top: 0;
    width: 0;
    height: 0;
    border-left: 30px solid transparent;
    border-right: 30px solid transparent;
    border-top: 20px solid #e0e0e0;
    transform-origin: top;
}
.envelope-body {
    position: absolute;
    bottom: 0;
    width: 0;
    height: 0;
    border-left: 30px solid #f5f5f5;
    border-right: 30px solid #f5f5f5;
    border-bottom: 25px solid #eaeaea;
    z-index: 3;
}
.letter {
    position: absolute;
    top: 5px;
    left: 5px;
    width: 50px;
    height: 30px;
    background: #fff;
    border: 1px solid #ddd;
    animation: pullOut 2.5s ease-in-out infinite;
}
.letter-text {
    font-size: 6px;
    text-align: center;
    line-height: 30px;
}

/* Estilos del Buzón */
.mailbox {
    position: absolute;
    bottom: 10px;
    left: 25px;
    width: 100px;
    height: 70px;
    background: linear-gradient(135deg, #1e222b 0%, #141619 100%);
    border: 2px solid #00d2ff;
    border-radius: 8px 8px 0 0;
    box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
    z-index: 4;
}
.mailbox-slot {
    position: absolute;
    top: 15px;
    left: 10px;
    width: 80px;
    height: 8px;
    background-color: #05070a;
    border-radius: 4px;
    border: 1px solid rgba(0, 210, 255, 0.3);
}

/* KEYFRAMES DE ANIMACIÓN */
@keyframes dropLetter {
    0% { transform: translateY(-50px) scale(0); opacity: 0; }
    20% { transform: translateY(0) scale(1); opacity: 1; }
    50% { transform: translateY(0) scale(1); opacity: 1; z-index: 2; }
    75% { transform: translateY(35px) scale(0.6); opacity: 0.8; z-index: 5; }
    85%, 100% { transform: translateY(50px) scale(0); opacity: 0; z-index: 5; }
}

@keyframes pullOut {
    0%, 20% { transform: translateY(0); }
    35%, 50% { transform: translateY(-15px); }
    70%, 100% { transform: translateY(0); }
}

@keyframes loadBar {
    to { width: 100%; }
}
</style>

<script>
    // Espera 4 segundos (4000ms) y devuelve al usuario a la página de reseñas
    setTimeout(function() {
        window.location.href = "{{ url_for('ver_reseñas') }}";
    }, 4000);
</script>
{% endblock %}
