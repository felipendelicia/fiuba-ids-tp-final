{% extends 'base.html' %}

{% block title %}Kinetix - Reservar Partida Privada{% endblock %}

{% block style_extra %}
<style>
    /* Contenedor principal con fondo de cuadrícula táctica de Kinetix */
    .reserva-section {
        background-color: #0b0d0f;
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 20px 20px;
        padding: 60px 0;
        width: 100%;
        min-height: calc(100vh - 80px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* Título con el degradé cian característico */
    .reserva-title {
        font-family: 'Orbitron', 'Arial Black', sans-serif;
        font-size: 32px;
        font-weight: bold;
        letter-spacing: 2px;
        margin-bottom: 30px;
        text-transform: uppercase;
        background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-align: center;
    }

    /* Tarjeta del formulario estilizada con transparencias */
    .booking-card {
        background-color: rgba(18, 22, 26, 0.75);
        border: 1px solid rgba(79, 172, 254, 0.25);
        border-radius: 16px;
        padding: 30px;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        margin-bottom: 25px;
    }

    /* Agrupación de campos y etiquetas */
    .form-group {
        margin-bottom: 20px;
    }

    .group-title {
        display: block;
        font-family: 'Orbitron', sans-serif;
        font-size: 14px;
        color: #00f2fe;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
    }

    /* Estilización de los Selects y el Input de fecha */
    .select-wrapper select, 
    .datepicker-input {
        width: 100%;
        padding: 12px 16px;
        background-color: rgba(11, 13, 15, 0.8);
        border: 1px solid rgba(79, 172, 254, 0.3);
        border-radius: 8px;
        color: #ffffff;
        font-family: 'Arial', sans-serif;
        font-size: 15px;
        outline: none;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    /* Efecto de foco iluminado al hacer click en los campos */
    .select-wrapper select:focus, 
    .datepicker-input:focus {
        border-color: #00f2fe;
        box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
    }

    /* Ajuste para el icono del calendario nativo de HTML5 */
    .datepicker-input::-webkit-calendar-picker-indicator {
        filter: invert(1) sepia(1) saturate(5) hue-rotate(165deg);
        cursor: pointer;
    }

    /* Sección del precio total */
    .total-section {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-family: 'Orbitron', sans-serif;
    }

    .total-section span {
        font-size: 16px;
        color: #a0aec0;
        text-transform: uppercase;
    }

    .total-section .price {
        font-size: 24px;
        color: #ff9f43; /* Color naranja destacado para el precio */
        font-weight: bold;
        text-shadow: 0 0 8px rgba(255, 159, 67, 0.2);
    }

    /* Botón de Reservar Táctico */
    .reservar {
        width: 100%;
        max-width: 450px;
        text-align: center;
    }

    .reservar a {
        display: block;
        width: 100%;
        padding: 15px;
        font-family: 'Orbitron', sans-serif;
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 2px;
        color: #0b0d0f;
        text-transform: uppercase;
        text-decoration: none;
        background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .reservar a:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
        color: #0b0d0f;
    }
</style>
{% endblock %}

{% block content %}
<section class="reserva-section">
    
    <h1 class="reserva-title">Seleccionaste Partida Privada</h1>

    <div class="booking-card">

        <div class="form-group">
            <label class="group-title">Modalidad</label>
            <div class="select-wrapper">
                <select id="modalidad">
                    <option value="" disabled selected hidden>Selecciona una modalidad</option>
                    <option value="1">Captura la bandera</option>
                    <option value="2">Competitivo</option>
                    <option value="3">Todos contra todos</option>
                    <option value="4">Dominación</option>
                    <option value="5">Competitivo</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="group-title">Campo de juego</label>
            <div class="select-wrapper">
                <select id="campo">
                    <option value="" disabled selected hidden>Selecciona un escenario</option>
                    <option value="campo1">Campo Nuketown</option>
                    <option value="campo2">Campo Mirage</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="group-title">Pack de equipamiento</label>
            <div class="select-wrapper">
                <select id="pack">
                    <option value="" disabled selected hidden>Selecciona tu equipamiento</option>
                    <option value="basico">Básico</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="fecha" class="group-title">Fechas disponibles</label>
            <input type="date" id="fecha" class="datepicker-input">
        </div>

        <div class="total-section">
            <span>Total:</span>
            <span class="price">$15000.00</span>
        </div>

    </div>

    <div class="reservar">
        <a href="{{ url_for('confirma_sala_privada') }}">Confirmar Reserva</a>
    </div>

</section>
{% endblock %}
