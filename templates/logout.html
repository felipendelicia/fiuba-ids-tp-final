<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetix - Cerrando Sesión</title>
    
    <meta http-equiv="refresh" content="3;url={{ url_for('login') }}">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body>

<div class="container d-flex flex-column align-items-center justify-content-center" style="min-height: 100vh; user-select: none; cursor: default;">
    <div class="p-5 rounded-3 shadow-lg text-center" style="background-color: rgba(20, 22, 25, 0.95); border: 1px solid rgba(255, 179, 0, 0.2); max-width: 500px;">
        
        <div class="mb-4">
            <div class="spinner-border text-warning" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Cargando...</span>
            </div>
        </div>

        <h2 class="fw-bold mb-3" style="font-family: 'Orbitron', sans-serif; color: #ffb300; letter-spacing: 1px;">
            CERRANDO SESIÓN
        </h2>
        
        <p class="text-white-50 mb-0">
            Tu sesión se ha cerrado. Redirigiéndote al login de forma segura...
        </p>
    </div>
</div>

</body>
</html>
