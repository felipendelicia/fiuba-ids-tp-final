{% extends "base.html"%}

{% block title%}Airsoft - Password{% endblock %}

{% block style_extra %}
<link rel="stylesheet" href="{{ url_for('static', filename='styles/login.css')}}">
{% endblock %}

{% block content %}
    <section id="sectionPassword">
        <video autoplay muted loop class="video-backg">
            <source src="{{url_for('static', filename='video/video-login.mp4')}}" type="video/mp4">
        </video>
        <div class="box-form">
            <h2>Recuperación de Contraseña</h2>
            <p>Escribí tu email registrado y recibí<br>las instrucciones para recuperar tu contraseña</p>
            <form class="style-form" action="">
                <label for="email">Email</label><br>
                <input type="email" required><br>

                <div class="box-center">
                    <button class="btn-form" type="submit">Recuperar Contraseña</button>
                    <button class="btn-form-back" type="button"><a href="{{url_for('login')}}">Volver</a></button>
                </div>
            </form>
        </div>
    </section>
{% endblock %}
